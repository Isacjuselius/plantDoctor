<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="../css/style.css">
	<link rel="stylesheet" href="../css/fonts.css">
	<script src="../js/chart.js"></script>
	<title>Plant Doctor</title>
</head>

<body>
<nav>
			<div class="logo">
				<img src="../assets/img/eco.svg" class="logo" alt="">
				<a href="index.html" class="logoLink">
					Plant-Doctor
				</a>
			</div>
			<div class="navContainer">
				<div class="navItem focused">
					<img src="../assets/img/potted_plant.svg" class="logo" alt="">
					<a href="index.html">Overview</a>
				</div>
				<div class="navItem">
					<img src="../assets/img/potted_plant.svg" class="logo" alt="">
					<a href="index.html">Details</a>
				</div>
			</div>
		</nav>
	<main>
		<section class="overviewContainer">
			<div id="dataOverviewContainer">
				<div class="plantOverview">
					<h2 class="plantName">Clusia Rosea</h2>
					<div class="overViewContent">
						<p>Overall mood:</p>
						<div class="iconWithText">
							<p id="moodTitle">--</p>
							<img src="../assets/img/mood.svg" alt="" id="moodPic">
						</div>
					</div>
					<div class="overViewContent">
						<p>Automated watering:</p>
						<div class="toggle">
							<input type="checkbox" id="autoWaterToggle"/>
							<label></label>
						</div>
					</div>
				</div>

				<div class="plantDetails">
					<div class="plantDetailsContainer">
						<div class="plantDetailsItem">
							<div class="iconWithText">
								<h2>Plant Details</h2>
							</div>
							<div>
								<a href="/html/overview.html" class="plantDetailsLink"><img src="../assets/img/arrow_outward.svg" alt="See more"></a>
							</div>
						</div>
						<div class="plantDetailsContainer">
							<div class="plantDetailsItem">
								<div class="iconWithText">
									<img src="../assets/img/thermostat.svg" alt="">
									<p>Temperature:</p>
								</div>
								<div>
									<p id="temperatureValue">--</p>
								</div>
							</div>

							<div class="plantDetailsItem">
								<div class="iconWithText">
									<img src="../assets/img/sunny.svg" alt="">
									<p>Light level:</p>
								</div>
								<div>
									<p id="lightLevelValue">--</p>
								</div>
							</div>

							<div class="plantDetailsItem">
								<div class="iconWithText">
									<img src="../assets/img/water.svg" alt="">
									<p>Water level:</p>
								</div>
								<div>
									<p id="waterLevelValue">Sufficient</p>
								</div>
							</div>
							<hr>
							<div class="progressItem">
								<div class="plantDetailsItem">
									<div class="iconWithText">
										<img src="../assets/img/sprinkler.svg" alt="">
										<p>Soil moisture:</p>
									</div>
									<div>
										<p id="moistureValue">40%</p>
									</div>
								</div>
								<progress id="moistureProgress" value="40" max="100"></progress>
							</div>
							<div class="progressItem">
								<div class="plantDetailsItem">
									<div class="iconWithText">
										<img src="../assets/img/humidity_mid.svg" alt="">
										<p>Humidity:</p>
									</div>
									<div>
										<p id="humidityValue">60%</p>
									</div>
								</div>
								<progress id="humidityProgress" value="60" max="100"></progress>
							</div>
						</div>
					</div>
				</div>
		</section>
		<section class="plant">
			<img src="../assets/img/plant.png" class="plant-image" alt="">
			<div class="plantTemperature plantStatusBlob">
				<p class="plantStatusLabel">Temperature</p>
				<h3 class="platStatusValue" id="statusTemperature" >Optimal</h3>
				<img src="../assets/img/pointer.png" alt="" class="statusPointer">
			</div>
			<div class="plantSunlight plantStatusBlob">
				<p class="plantStatusLabel">Sunlight</p>
				<h3 class="platStatusValue" id="statusLightLevel">High</h3>
				<img src="../assets/img/pointer.png" alt="" class="statusPointer">
			</div>
			<div class="plantHumidity plantStatusBlob">
				<p class="plantStatusLabel">Humidity</p>
				<h3 class="platStatusValue" id="statusHumidity">High</h3>
				<img src="../assets/img/pointer.png" alt="" class="statusPointer">	
			</div>
			<div class="plantSoilMoisture plantStatusBlob">
				<p class="plantStatusLabel">Soil Moisture</p>
				<h3 class="platStatusValue" id="statusMoisture">Optimal</h3>
				<img src="../assets/img/pointer.png" alt="" class="statusPointer">	
			</div>
		</section>
	</main>
	<script src="/socket.io/socket.io.js"></script>
	<script src="../js/mood.js"></script>
	<script src="../js/script.js"></script>
</body>

</html>
